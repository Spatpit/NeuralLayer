[package]
name = "neurallayer"
version = "0.7.1"
edition = "2021"
rust-version = "1.88"
description = "A portable transparent canvas with an embedded menu and one-time window fitting"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
egui = { version = "=0.29.1", features = ["default_fonts"] }
egui-winit = { version = "=0.29.1", default-features = false, features = ["clipboard", "links"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
raw-window-handle = "0.6.2"
image = { version = "=0.25.9", default-features = false, features = ["png"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_HiDpi"] }

[build-dependencies]
winres = "0.1.12"
cc = "=1.2.62"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
